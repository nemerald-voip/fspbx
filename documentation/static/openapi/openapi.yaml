      description: "Emails a link that lets an existing local FS PBX user choose a new password.\nUse this after creating a user to set up their first password, or to help\nan existing user regain access. Returns confirmation that the email was sent.\n\nNo request body is needed. The email goes to the user's saved `user_email`\nand uses the existing password-reset email template. Passwords, reset tokens,\nand reset URLs are never returned. The current password stays valid until\nthe user completes the reset; sending the email does not enable a disabled user.\n\nLinks are single-use and expire according to the password-reset configuration\n(60 minutes by default). Repeat requests for the same recipient are throttled\naccording to that configuration (60 seconds by default), returning HTTP 429.\n\nRequires domain access and `user_edit`. The user must belong to the domain\nin the URL. Non-superadmins cannot request resets for superadmins or users\nabove their role level. Directory-managed users must reset their passwords\nthrough the connected directory."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  object: password_reset
                  user_uuid: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
                  sent: true
                properties:
                  object:
                    type: string
                    example: password_reset
                  user_uuid:
                    type: string
                    example: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
                  sent:
                    type: boolean
                    example: true
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'This user is managed by an external directory. Reset the password in the connected directory.'
                    code: invalid_parameter
                    param: user_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'This user is managed by an external directory. Reset the password in the connected directory.'
                      code:
                        type: string
                        example: invalid_parameter
                      param:
                        type: string
                        example: user_uuid
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: authentication_error
                    message: Unauthenticated.
                    code: unauthenticated
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Unauthenticated.
                      code:
                        type: string
                        example: unauthenticated
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'You are not allowed to manage this user.'
                    code: forbidden
                    param: null
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'You are not allowed to manage this user.'
                      code:
                        type: string
                        example: forbidden
                      param:
                        type: string
                        example: null
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'User not found.'
                    code: resource_missing
                    param: user_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'User not found.'
                      code:
                        type: string
                        example: resource_missing
                      param:
                        type: string
                        example: user_uuid
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: rate_limit_error
                    message: 'Please wait before requesting another password reset email.'
                    code: password_reset_throttled
                    param: null
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: rate_limit_error
                      message:
                        type: string
                        example: 'Please wait before requesting another password reset email.'
                      code:
                        type: string
                        example: password_reset_throttled
                      param:
                        type: string
                        example: null
        503:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: api_error
                    message: 'Unable to send the password reset email. Please try again later.'
                    code: mail_delivery_failed
                    param: null
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: api_error
                      message:
                        type: string
                        example: 'Unable to send the password reset email. Please try again later.'
                      code:
                        type: string
                        example: mail_delivery_failed
                      param:
                        type: string
                        example: null
      tags:
        - Users
    parameters:
      -
        in: path
        name: domain_uuid
        description: 'The domain UUID.'
        example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
        required: true
        schema:
          type: string
      -
        in: path
        name: user_uuid
        description: 'The user UUID.'
        example: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
        required: true
        schema:
          type: string
  '/api/v1/domains/{domain_uuid}/voicemails':
    get:
      summary: 'List voicemails'
      operationId: listVoicemails
      description: "Returns voicemails for the specified domain the caller is allowed to access.\n\nAccess rules:\n- Caller must have access to the target domain (domain scope).\n- Caller must have the `voicemail_domain` permission.\n\nPagination (cursor-based):\n- Both `limit` and `starting_after` are optional.\n- If `limit` is not provided, it defaults to 50.\n- If `starting_after` is not provided, results start from the beginning.\n- If `has_more` is true, request the next page by passing `starting_after`\n  equal to the last item's `voicemail_uuid` from the previous response.\n\nExamples:\n- First page: `GET /api/v1/domains/{domain_uuid}/voicemails`\n- Next page:  `GET /api/v1/domains/{domain_uuid}/voicemails?starting_after={last_voicemail_uuid}`\n- Custom size: `GET /api/v1/domains/{domain_uuid}/voicemails?limit=50`"
      parameters:
        -
          in: query
          name: limit
          description: 'Optional. Number of results to return (min 1, max 100). Defaults to 50.'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Optional. Number of results to return (min 1, max 100). Defaults to 50.'
            example: 25
        -
          in: query
          name: starting_after
          description: 'Optional. Return results after this voicemail UUID (cursor).'
          example: d2c7b17c-8b0d-4f0f-b5ff-2cfb6d7a4f4b
          required: false
          schema:
            type: string
            description: 'Optional. Return results after this voicemail UUID (cursor).'
            example: d2c7b17c-8b0d-4f0f-b5ff-2cfb6d7a4f4b
      responses:
        200:
          description: Success
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"object\": \"list\",\n  \"url\": \"/api/v1/domains/4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b/voicemails\",\n  \"has_more\": true,\n  \"data\": [\n    {\n      \"voicemail_uuid\": \"d2c7b17c-8b0d-4f0f-b5ff-2cfb6d7a4f4b\",\n      \"object\": \"voicemail\",\n      \"domain_uuid\": \"4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b\",\n      \"voicemail_id\": \"1001\",\n      \"voicemail_password: \"1001\",\n      \"voicemail_mail_to\": \"frontdesk@example.com\",\n      \"voicemail_sms_to\": null,\n      \"voicemail_transcription_enabled\": true,\n      \"voicemail_local_after_email\": true,\n      \"voicemail_tutorial\": true,\n      \"voicemail_recording_instructions\": true,\n      \"voicemail_file\": \"attach\",\n      \"voicemail_alternate_greet_id\": 200,\n      \"voicemail_description\": \"Front desk voicemail\",\n      \"greeting_id\": 3,\n      \"voicemail_enabled\": true\n    }\n  ]\n}"
        400:
          description: 'Invalid starting_after UUID'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Invalid starting_after UUID.'
                    code: invalid_request
                    param: starting_after
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Invalid starting_after UUID.'
                      code:
                        type: string
                        example: invalid_request
                      param:
                        type: string
                        example: starting_after
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: authentication_error
                    message: Unauthenticated.
                    code: unauthenticated
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Unauthenticated.
                      code:
                        type: string
                        example: unauthenticated
        403:
          description: 'Forbidden (domain access)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'You do not have access to this domain.'
                    code: forbidden_domain
                    param: domain_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'You do not have access to this domain.'
                      code:
                        type: string
                        example: forbidden_domain
                      param:
                        type: string
                        example: domain_uuid
        404:
          description: 'Not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Domain not found.'
                    code: resource_missing
                    param: domain_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
