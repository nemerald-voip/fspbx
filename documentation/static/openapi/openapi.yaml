                  example: true
                voicemail_tutorial:
                  type: boolean
                  description: 'Whether voicemail tutorial is enabled. If omitted, unchanged.'
                  example: true
                voicemail_recording_instructions:
                  type: boolean
                  description: 'Whether voicemail recording instructions are enabled. If omitted, unchanged.'
                  example: true
                voicemail_file:
                  type: string
                  description: 'Voicemail delivery mode. Use "attach" to attach the recording, "link" to email a signed download link, or blank for notification only. If omitted, unchanged. Must not be greater than 50 characters.'
                  example: link
                  enum:
                    - attach
                    - link
                    - ''
                voicemail_description:
                  type: string
                  description: 'Optional voicemail description/label. If omitted, unchanged. Use null to clear. Must not be greater than 255 characters.'
                  example: 'Front Desk Voicemail (updated)'
                greeting_id:
                  type: integer
                  description: 'Greeting ID to use for this voicemail (if applicable). If omitted, unchanged. Use null to clear.'
                  example: 3
                voicemail_alternate_greet_id:
                  type: integer
                  description: 'Alternate greeting ID (if applicable). If omitted, unchanged. Use null to clear.'
                  example: 200
                voicemail_enabled:
                  type: boolean
                  description: 'Whether voicemail is enabled. If omitted, unchanged.'
                  example: true
    delete:
      summary: 'Delete a voicemail'
      operationId: deleteAVoicemail
      description: "Deletes a voicemail within the specified domain.\n\nAccess rules:\n- Caller must have access to the target domain (domain scope).\n- Caller must have the `voicemail_delete` permission."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  object: voicemail
                  uuid: d2c7b17c-8b0d-4f0f-b5ff-2cfb6d7a4f4b
                  deleted: true
                properties:
                  object:
                    type: string
                    example: voicemail
                  uuid:
                    type: string
                    example: d2c7b17c-8b0d-4f0f-b5ff-2cfb6d7a4f4b
                  deleted:
                    type: boolean
                    example: true
        400:
          description: 'Invalid voicemail UUID'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Invalid voicemail UUID.'
                    code: invalid_request
                    param: voicemail_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Invalid voicemail UUID.'
                      code:
                        type: string
                        example: invalid_request
                      param:
                        type: string
                        example: voicemail_uuid
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: authentication_error
                    message: Unauthenticated.
                    code: unauthenticated
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Unauthenticated.
                      code:
                        type: string
                        example: unauthenticated
        403:
          description: 'Forbidden (domain access)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'You do not have access to this domain.'
                    code: forbidden_domain
                    param: domain_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'You do not have access to this domain.'
                      code:
                        type: string
                        example: forbidden_domain
                      param:
                        type: string
                        example: domain_uuid
        404:
          description: 'Voicemail not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Voicemail not found.'
                    code: resource_missing
                    param: voicemail_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Voicemail not found.'
                      code:
                        type: string
                        example: resource_missing
                      param:
                        type: string
                        example: voicemail_uuid
      tags:
        - Voicemails
    parameters:
      -
        in: path
        name: domain_uuid
        description: 'The domain UUID.'
        example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
        required: true
        schema:
          type: string
      -
        in: path
        name: voicemail_uuid
        description: 'The voicemail UUID.'
        example: d2c7b17c-8b0d-4f0f-b5ff-2cfb6d7a4f4b
        required: true
        schema:
          type: string
