  '/api/v1/domains/{domain_uuid}/recordings':
    get:
      summary: 'List recordings'
      operationId: listRecordings
      description: "Returns recordings for the specified domain the caller is allowed to access.\n\nAccess rules:\n- Caller must have access to the target domain (domain scope).\n- Caller must have the `recording_view` permission.\n\nPagination (cursor-based):\n- Both `limit` and `starting_after` are optional.\n- If `limit` is not provided, it defaults to 50.\n- If `starting_after` is not provided, results start from the beginning.\n- If `has_more` is true, request the next page by passing `starting_after`\n  equal to the last item's `recording_uuid` from the previous response.\n\nExamples:\n- First page: `GET /api/v1/domains/{domain_uuid}/recordings`\n- Next page: `GET /api/v1/domains/{domain_uuid}/recordings?starting_after={last_recording_uuid}`\n- Custom size: `GET /api/v1/domains/{domain_uuid}/recordings?limit=50`"
      parameters:
        -
          in: query
          name: limit
          description: 'Optional. Number of results to return (min 1, max 100). Defaults to 50.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Optional. Number of results to return (min 1, max 100). Defaults to 50.'
            example: 50
        -
          in: query
          name: starting_after
          description: 'Optional. Return results after this recording UUID (cursor).'
          example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
          required: false
          schema:
            type: string
            description: 'Optional. Return results after this recording UUID (cursor).'
            example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  object: list
                  url: /api/v1/domains/4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b/recordings
                  has_more: true
                  data:
                    -
                      recording_uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                      object: recording
                      domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                      recording_name: 'Main Menu Greeting'
                      recording_description: 'Primary virtual receptionist greeting'
                      recording_filename: uploaded_abc123.wav
                      audio_available: true
                      audio_replaced: false
                      bytes: null
                      sha256: null
                properties:
                  object:
                    type: string
                    example: list
                  url:
                    type: string
                    example: /api/v1/domains/4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b/recordings
                  has_more:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      -
                        recording_uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        object: recording
                        domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                        recording_name: 'Main Menu Greeting'
                        recording_description: 'Primary virtual receptionist greeting'
                        recording_filename: uploaded_abc123.wav
                        audio_available: true
                        audio_replaced: false
                        bytes: null
                        sha256: null
                    items:
                      type: object
                      properties:
                        recording_uuid:
                          type: string
                          example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        object:
                          type: string
                          example: recording
                        domain_uuid:
                          type: string
                          example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                        recording_name:
                          type: string
                          example: 'Main Menu Greeting'
                        recording_description:
                          type: string
                          example: 'Primary virtual receptionist greeting'
                        recording_filename:
                          type: string
                          example: uploaded_abc123.wav
                        audio_available:
                          type: boolean
                          example: true
                        audio_replaced:
                          type: boolean
                          example: false
                        bytes:
                          type: string
                          example: null
                        sha256:
