openapi: 3.0.3
info:
  title: 'FS PBX API'
  description: ''
  version: v1
servers:
  -
    url: 'https://{host}'
    description: 'FS PBX API server'
    variables:
      host:
        default: YOUR-FSPBX-HOST
        description: 'Hostname where FS PBX is running (example: fspbx.your-domain.net)'
paths:
  '/api/v1/domains/{domain_uuid}/active-calls':
    get:
      summary: 'List active calls'
      operationId: listActiveCalls
      description: "Returns active calls for the specified domain.\n\nPagination (snapshot cursor-based):\n- Both `limit` and `starting_after` are optional.\n- If `limit` is not provided, it defaults to 50.\n- If `starting_after` is not provided, results start from the beginning."
      parameters:
        -
          in: query
          name: limit
          description: 'Optional. Number of results to return (min 1, max 100). Defaults to 50.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Optional. Number of results to return (min 1, max 100). Defaults to 50.'
            example: 50
        -
          in: query
          name: starting_after
          description: 'Optional. Return results after this active call UUID in the current snapshot.'
          example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
          required: false
          schema:
            type: string
            description: 'Optional. Return results after this active call UUID in the current snapshot.'
            example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
        -
          in: query
          name: search
          description: 'Optional. Search caller, destination, app, codec, or secure fields.'
          example: '1001'
          required: false
          schema:
            type: string
            description: 'Optional. Search caller, destination, app, codec, or secure fields.'
            example: '1001'
        -
          in: query
          name: sort
          description: 'Optional. Sort field. One of: context, created_epoch, duration, cid_name, cid_num, dest, application, read_codec, secure. Defaults to created_epoch.'
          example: created_epoch
          required: false
          schema:
            type: string
            description: 'Optional. Sort field. One of: context, created_epoch, duration, cid_name, cid_num, dest, application, read_codec, secure. Defaults to created_epoch.'
            example: created_epoch
        -
          in: query
          name: order
          description: 'Optional. Sort direction: asc or desc. Defaults to desc.'
          example: desc
          required: false
          schema:
            type: string
            description: 'Optional. Sort direction: asc or desc. Defaults to desc.'
            example: desc
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  object: list
                  url: /api/v1/domains/4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b/active-calls
                  has_more: false
                  data:
                    -
                      uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                      object: active_call
                      domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                      direction: inbound
                      created_epoch: '1774920000'
                      created_display: '2026-04-30 14:00:00'
                      duration_seconds: 42
                      cid_name: 'Alice Johnson'
                      cid_num: '1001'
                      dest: '1002'
                      application: bridge
                      application_data: sofia/internal/1002@pbx.example.com
                      secure: 'true'
                      context: pbx.example.com
                properties:
                  object:
                    type: string
                    example: list
                  url:
                    type: string
                    example: /api/v1/domains/4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b/active-calls
                  has_more:
                    type: boolean
                    example: false
                  data:
                    type: array
                    example:
                      -
                        uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        object: active_call
                        domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                        direction: inbound
                        created_epoch: '1774920000'
                        created_display: '2026-04-30 14:00:00'
                        duration_seconds: 42
                        cid_name: 'Alice Johnson'
                        cid_num: '1001'
                        dest: '1002'
                        application: bridge
                        application_data: sofia/internal/1002@pbx.example.com
                        secure: 'true'
                        context: pbx.example.com
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        object:
                          type: string
                          example: active_call
                        domain_uuid:
                          type: string
                          example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                        direction:
                          type: string
                          example: inbound
                        created_epoch:
                          type: string
                          example: '1774920000'
                        created_display:
                          type: string
                          example: '2026-04-30 14:00:00'
                        duration_seconds:
                          type: integer
                          example: 42
                        cid_name:
                          type: string
                          example: 'Alice Johnson'
                        cid_num:
                          type: string
                          example: '1001'
                        dest:
                          type: string
                          example: '1002'
                        application:
                          type: string
                          example: bridge
                        application_data:
                          type: string
                          example: sofia/internal/1002@pbx.example.com
                        secure:
                          type: string
                          example: 'true'
                        context:
                          type: string
                          example: pbx.example.com
        400:
          description: 'Invalid starting_after UUID'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Invalid starting_after UUID.'
                    code: invalid_request
                    param: starting_after
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Invalid starting_after UUID.'
                      code:
                        type: string
                        example: invalid_request
                      param:
                        type: string
                        example: starting_after
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: authentication_error
                    message: Unauthenticated.
                    code: unauthenticated
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Unauthenticated.
                      code:
                        type: string
                        example: unauthenticated
        404:
          description: 'Domain not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Domain not found.'
                    code: resource_missing
                    param: domain_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Domain not found.'
                      code:
                        type: string
                        example: resource_missing
                      param:
                        type: string
                        example: domain_uuid
      tags:
        - 'Active Calls'
    parameters:
      -
        in: path
        name: domain_uuid
        description: 'The domain UUID.'
        example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
        required: true
        schema:
          type: string
  '/api/v1/domains/{domain_uuid}/active-calls/{call_uuid}':
    get:
      summary: 'Retrieve an active call'
      operationId: retrieveAnActiveCall
      description: 'Returns a single active call for the specified domain.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                  object: active_call
                  domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                  direction: inbound
                  created_epoch: '1774920000'
                  created_display: '2026-04-30 14:00:00'
                  duration_seconds: 42
                  cid_name: 'Alice Johnson'
                  cid_num: '1001'
                  dest: '1002'
                  application: bridge
                  application_data: sofia/internal/1002@pbx.example.com
                  secure: 'true'
                  context: pbx.example.com
                properties:
                  uuid:
                    type: string
                    example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                  object:
                    type: string
                    example: active_call
                  domain_uuid:
                    type: string
                    example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                  direction:
                    type: string
                    example: inbound
                  created_epoch:
                    type: string
                    example: '1774920000'
                  created_display:
                    type: string
                    example: '2026-04-30 14:00:00'
                  duration_seconds:
                    type: integer
                    example: 42
                  cid_name:
                    type: string
                    example: 'Alice Johnson'
                  cid_num:
                    type: string
                    example: '1001'
                  dest:
                    type: string
                    example: '1002'
                  application:
                    type: string
                    example: bridge
                  application_data:
                    type: string
                    example: sofia/internal/1002@pbx.example.com
                  secure:
                    type: string
                    example: 'true'
                  context:
                    type: string
                    example: pbx.example.com
        400:
          description: 'Invalid call UUID'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Invalid call UUID.'
                    code: invalid_request
                    param: call_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Invalid call UUID.'
                      code:
                        type: string
                        example: invalid_request
                      param:
                        type: string
                        example: call_uuid
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: authentication_error
                    message: Unauthenticated.
                    code: unauthenticated
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Unauthenticated.
                      code:
                        type: string
                        example: unauthenticated
        404:
          description: 'Active call not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Active call not found.'
                    code: resource_missing
                    param: call_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Active call not found.'
                      code:
                        type: string
                        example: resource_missing
                      param:
                        type: string
                        example: call_uuid
      tags:
        - 'Active Calls'
    delete:
      summary: 'End an active call'
      operationId: endAnActiveCall
      description: 'Ends a single active call within the specified domain.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  object: active_call
                  uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                  deleted: true
                properties:
                  object:
                    type: string
                    example: active_call
                  uuid:
                    type: string
                    example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                  deleted:
                    type: boolean
                    example: true
        400:
          description: 'Invalid call UUID'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Invalid call UUID.'
                    code: invalid_request
                    param: call_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Invalid call UUID.'
                      code:
                        type: string
                        example: invalid_request
                      param:
                        type: string
                        example: call_uuid
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: authentication_error
                    message: Unauthenticated.
                    code: unauthenticated
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Unauthenticated.
                      code:
                        type: string
                        example: unauthenticated
        404:
          description: 'Active call not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Active call not found.'
                    code: resource_missing
                    param: call_uuid
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Active call not found.'
                      code:
                        type: string
                        example: resource_missing
                      param:
                        type: string
                        example: call_uuid
        500:
          description: 'Internal server error'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: api_error
                    message: 'Internal server error.'
                    code: internal_error
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: api_error
                      message:
                        type: string
                        example: 'Internal server error.'
                      code:
                        type: string
                        example: internal_error
      tags:
        - 'Active Calls'
    parameters:
      -
        in: path
        name: domain_uuid
        description: 'The domain UUID.'
        example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
        required: true
        schema:
          type: string
      -
        in: path
        name: call_uuid
        description: 'The active call UUID.'
        example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
        required: true
        schema:
          type: string
  '/api/v1/domains/{domain_uuid}/cdrs':
    get:
      summary: 'List Call Detail Records'
      operationId: listCallDetailRecords
      description: "Returns CDRs for the specified domain the caller is allowed to access.\n\nAccess rules:\n- Caller must have access to the target domain (domain scope).\n- Caller must have the `xml_cdr_view` permission.\n\nPagination (cursor-based):\n- Both `limit` and `starting_after` are optional.\n- If `limit` is not provided, it defaults to 500.\n- If `starting_after` is not provided, results start from the beginning.\n- If `has_more` is true, request the next page by passing `starting_after`\n  equal to the last item's `xml_cdr_uuid` from the previous response.\n\nOptional filters:\n- `search` matches caller/destination fields and status.\n- `direction` filters by call direction.\n- `status` filters by call status.\n  Accepted values: `answered`, `no answer`, `cancelled`, `voicemail`,\n  `missed call`, `abandoned`, `callback_requested`.\n- `extension_uuid` filters by extension UUID.\n- `call_center_queue_uuid` filters by queue UUID.\n- `date_from` and `date_to` filter by `start_epoch` in epoch seconds.\n\nExamples:\n- First page: `GET /api/v1/domains/{domain_uuid}/cdrs`\n- Next page:  `GET /api/v1/domains/{domain_uuid}/cdrs?starting_after={last_xml_cdr_uuid}`\n- Custom size: `GET /api/v1/domains/{domain_uuid}/cdrs?limit=25`\n- Search: `GET /api/v1/domains/{domain_uuid}/cdrs?search=2135551212`\n- Date range (epoch): `GET /api/v1/domains/{domain_uuid}/cdrs?date_from=1775001600&date_to=1775087999`"
      parameters:
        -
          in: query
          name: limit
          description: 'Optional. Number of results to return (min 1, max 500). Defaults to 500.'
          example: 500
          required: false
          schema:
            type: integer
            description: 'Optional. Number of results to return (min 1, max 500). Defaults to 500.'
            example: 500
        -
          in: query
          name: starting_after
          description: 'Optional. Return results after this CDR UUID (cursor).'
          example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
          required: false
          schema:
            type: string
            description: 'Optional. Return results after this CDR UUID (cursor).'
            example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
        -
          in: query
          name: search
          description: 'Optional. Search caller name, numbers, SIP Call-ID, and status.'
          example: '2135551212'
          required: false
          schema:
            type: string
            description: 'Optional. Search caller name, numbers, SIP Call-ID, and status.'
            example: '2135551212'
        -
          in: query
          name: direction
          description: 'Optional. Filter by direction.'
          example: inbound
          required: false
          schema:
            type: string
            description: 'Optional. Filter by direction.'
            example: inbound
        -
          in: query
          name: status
          description: 'Optional. Filter by status. Accepted values: answered, no answer, cancelled, voicemail, missed call, abandoned, callback_requested.'
          example: answered
          required: false
          schema:
            type: string
            description: 'Optional. Filter by status. Accepted values: answered, no answer, cancelled, voicemail, missed call, abandoned, callback_requested.'
            example: answered
        -
          in: query
          name: extension_uuid
          description: 'Optional. Filter by extension UUID.'
          example: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
          required: false
          schema:
            type: string
            description: 'Optional. Filter by extension UUID.'
            example: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
        -
          in: query
          name: call_center_queue_uuid
          description: 'Optional. Filter by queue UUID.'
          example: 89ea1ec3-44f8-4705-8f2c-f9769486f9f1
          required: false
          schema:
            type: string
            description: 'Optional. Filter by queue UUID.'
            example: 89ea1ec3-44f8-4705-8f2c-f9769486f9f1
        -
          in: query
          name: date_from
          description: 'Optional. Start of date range in epoch seconds (UTC).'
          example: 1775001600
          required: false
          schema:
            type: integer
            description: 'Optional. Start of date range in epoch seconds (UTC).'
            example: 1775001600
        -
          in: query
          name: date_to
          description: 'Optional. End of date range in epoch seconds (UTC).'
          example: 1775087999
          required: false
          schema:
            type: integer
            description: 'Optional. End of date range in epoch seconds (UTC).'
            example: 1775087999
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  object: list
                  url: /api/v1/domains/4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b/cdrs
                  has_more: true
                  data:
                    -
                      xml_cdr_uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                      object: cdr
                      domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                      sip_call_id: 0f4b17db-3ef1-476d-b6e7-bcfe07dfd001
                      extension_uuid: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
                      recording_uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                      direction: inbound
                      caller_id_name: 'John Smith'
                      caller_id_number: '2135551212'
                      caller_destination: '1001'
                      destination_number: '1001'
                      start_epoch: 1775787900
                      answer_epoch: 1775787905
                      end_epoch: 1775787960
                      duration: 60
                      hangup_cause: NORMAL_CLEARING
                      hangup_cause_q850: '16'
                      status: answered
                properties:
                  object:
                    type: string
                    example: list
                  url:
                    type: string
                    example: /api/v1/domains/4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b/cdrs
                  has_more:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      -
                        xml_cdr_uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        object: cdr
                        domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                        sip_call_id: 0f4b17db-3ef1-476d-b6e7-bcfe07dfd001
                        extension_uuid: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
                        recording_uuid: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        direction: inbound
                        caller_id_name: 'John Smith'
                        caller_id_number: '2135551212'
                        caller_destination: '1001'
                        destination_number: '1001'
                        start_epoch: 1775787900
                        answer_epoch: 1775787905
                        end_epoch: 1775787960
                        duration: 60
                        hangup_cause: NORMAL_CLEARING
                        hangup_cause_q850: '16'
                        status: answered
                    items:
                      type: object
                      properties:
                        xml_cdr_uuid:
                          type: string
                          example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        object:
                          type: string
                          example: cdr
                        domain_uuid:
                          type: string
                          example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                        sip_call_id:
                          type: string
                          example: 0f4b17db-3ef1-476d-b6e7-bcfe07dfd001
                        extension_uuid:
                          type: string
                          example: c9a76140-0ca4-4ea3-95af-7e12c2ff0df5
                        recording_uuid:
                          type: string
                          example: c0ec8113-aa15-40ac-8437-47185dd9dcf4
                        direction:
                          type: string
                          example: inbound
                        caller_id_name:
                          type: string
                          example: 'John Smith'
                        caller_id_number:
                          type: string
                          example: '2135551212'
                        caller_destination:
                          type: string
                          example: '1001'
                        destination_number:
                          type: string
                          example: '1001'
                        start_epoch:
                          type: integer
                          example: 1775787900
                        answer_epoch:
                          type: integer
                          example: 1775787905
                        end_epoch:
                          type: integer
                          example: 1775787960
                        duration:
                          type: integer
                          example: 60
                        hangup_cause:
                          type: string
                          example: NORMAL_CLEARING
                        hangup_cause_q850:
                          type: string
                          example: '16'
                        status:
                          type: string
                          example: answered
        400:
          description: 'Invalid date_to'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Invalid date_to value.'
                    code: invalid_request
                    param: date_to
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      message:
                        type: string
                        example: 'Invalid date_to value.'
                      code:
                        type: string
                        example: invalid_request
                      param:
                        type: string
                        example: date_to
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: authentication_error
                    message: Unauthenticated.
                    code: unauthenticated
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Unauthenticated.
                      code:
                        type: string
                        example: unauthenticated
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: permission_error
                    message: 'You do not have permission to access CDRs.'
                    code: forbidden
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: permission_error
                      message:
                        type: string
                        example: 'You do not have permission to access CDRs.'
                      code:
                        type: string
                        example: forbidden
        404:
          description: 'Domain not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Domain not found.'
