  '/api/v1/domains/{domain_uuid}/phone-control/actions':
    post:
      summary: 'Create a phone-control action'
      operationId: createAPhoneControlAction
      description: "Controls a registered phone or its active call through the same service\nused by `php artisan phone:control`. Vendor support differs, so first use\nthe targets endpoint and choose an action from that phone's\n`supported_actions`. Prefer `agent` when selecting a specific phone.\nSee [Supported phones and actions](https://www.fspbx.com/docs/additional-information/phone-control/#supported-phones-and-actions)\nfor vendor-specific capabilities and behavior.\n\nCall-state safeguards are enabled by default. Hold, resume, end-call,\ntransfer, and answer-call normally require one unambiguous call in the\nexpected state. `force=true` bypasses those checks. `dry_run=true`\nresolves the target and returns a command preview without sending it.\n\nAccess rules:\n- Caller must have access to the target domain.\n- Caller must have the `phone_control_call` permission."
      parameters: []
      responses:
        200:
          description: 'Dry run'
          content:
            application/json:
              schema:
                type: object
                example:
                  object: phone_control_action
                  action: hold
                  dry_run: true
                  sent: true
                  results:
                    -
                      sent: true
                      vendor: yealink
                      command: 'sendevent NOTIFY ...'
                      body: key=F_HOLD
                properties:
                  object:
                    type: string
                    example: phone_control_action
                  action:
                    type: string
                    example: hold
                  dry_run:
                    type: boolean
                    example: true
                  sent:
                    type: boolean
                    example: true
