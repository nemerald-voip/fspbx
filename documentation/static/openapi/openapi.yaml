  '/api/v1/domains/{domain_uuid}/reports/active-extensions':
    get:
      summary: 'Retrieve active and suspended extensions report'
      operationId: retrieveActiveAndSuspendedExtensionsReport
      description: "Returns the current \"Active and suspended extensions per domain\" report\nfor one domain as a single JSON object. No export or email is generated.\n\nAccess rules:\n- Caller must have access to the target domain (domain scope).\n- Caller must have the `extension_view` permission.\n\nCounts follow the report's definitions:\n- Total extensions includes all extensions, including disabled extensions.\n- Suspended extensions have their advanced setting `suspended` set to true.\n- Active extensions equals total minus suspended. Missing advanced settings\n  mean the extension is not suspended. This is not a SIP registration count.\n- Active mobile apps counts extensions with a linked mobile app in the same\n  domain whose stored status is 1, independently of extension suspension.\n- Domains without extensions return zero for every count."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  domain_uuid: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                  object: active_extension_report
                  domain_name: 10001.fspbx.com
                  domain_description: 'BluePeak Solutions'
                  total_extensions: 11
                  suspended_extensions: 2
                  active_extensions: 9
                  active_mobile_apps: 3
                properties:
                  domain_uuid:
                    type: string
                    example: 4018f7a3-8e0a-47bb-9f4f-04b1313e0e1b
                    description: 'UUID of the requested domain.'
                  object:
                    type: string
                    example: active_extension_report
                    description: 'Always `active_extension_report`.'
                  domain_name:
                    type: string
                    example: 10001.fspbx.com
                    description: 'Domain name.'
                  domain_description:
                    type: string
                    example: 'BluePeak Solutions'
                    description: 'Domain description, or null when unset.'
                  total_extensions:
                    type: integer
                    example: 11
                    description: 'Total number of extensions in the domain.'
                  suspended_extensions:
                    type: integer
                    example: 2
                    description: 'Number of suspended extensions.'
                  active_extensions:
                    type: integer
                    example: 9
                    description: 'Total extensions minus suspended extensions.'
                  active_mobile_apps:
                    type: integer
                    example: 3
                    description: 'Number of extensions with a linked mobile app whose stored status is 1.'
        400:
          description: 'Invalid domain UUID'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    type: invalid_request_error
                    message: 'Invalid domain UUID.'
                    code: invalid_request
                    param: domain_uuid
                properties:
