name: Sync GitHub Releases to Blog

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual execution to catch up past releases

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch and Generate Blog Posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Start with the initial URL (requesting the max 100 per page)
          URL="https://github.com"

          # Loop continuously as long as a valid next page URL exists
          while [ -n "$URL" ]; do
            echo "Fetching page: $URL"

            # Fetch response (headers + body combined)
            RESP=$(curl -i -s -H "Authorization: token $GITHUB_TOKEN" "$URL")

            # Separate HTTP Headers from the JSON Body
            HEADERS=$(echo "$RESP" | sed '/^\r$/q')
            RELEASES_JSON=$(echo "$RESP" | sed '1,/^\r$/d')

            # Extract individual releases from the page payload
            echo "$RELEASES_JSON" | jq -c '.[]' | while read -r release; do
              TITLE=$(echo "$release" | jq -r '.name // .tag_name')
              TAG=$(echo "$release" | jq -r '.tag_name')
              DATE=$(echo "$release" | jq -r '.published_at')
              BODY=$(echo "$release" | jq -r '.body')
              DRAFT=$(echo "$release" | jq -r '.draft')
              PRERELEASE=$(echo "$release" | jq -r '.prerelease')

              # Skip drafts and prereleases
              if [ "$DRAFT" = "true" ] || [ "$PRERELEASE" = "true" ]; then
                continue
              fi

              # Format date to YYYY-MM-DD for Docusaurus
              POST_DATE=$(echo "$DATE" | cut -d'T' -f1)
              FILENAME="blog/${POST_DATE}-${TAG}.md"

              # Write frontmatter using sequential, safe echoes
              if [ ! -f "$FILENAME" ]; then
                echo "Generating blog post for $TAG..."
                mkdir -p blog

                echo "---" > "$FILENAME"
                echo "title: \"$TITLE ($TAG)\"" >> "$FILENAME"
                echo "date: $DATE" >> "$FILENAME"
                echo "tags: [release]" >> "$FILENAME"
                echo "---" >> "$FILENAME"
                echo "" >> "$FILENAME"
                echo "$BODY" >> "$FILENAME"
              fi
            done

            # Parse the Link header to find the next page URL (if available)
            URL=$(echo "$HEADERS" | grep -Fi 'Link:' | sed -n -E 's/.*<([^>]+)>; rel="next".*/\1/p')
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: backfill all historical release notes across pages"
          branch: main
