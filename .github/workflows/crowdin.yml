name: Crowdin

on:
  push:
    branches: [ main ]
    paths:
      - 'resources/lang/*.json'
  workflow_dispatch: {}
  schedule:
    # Pull whatever translators have completed on Crowdin since the last run
    # and open a PR with it. Uploading sources (below) happens on every push
    # to main instead, so new/changed English strings reach Crowdin quickly.
    - cron: '0 13 * * 1'

jobs:
  upload-sources:
    name: Upload strings to Crowdin
    # workflow_dispatch too, so a manual run can bootstrap/refresh Crowdin
    # without waiting for a push that touches resources/lang/*.json.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `if:` can't reference `secrets` directly (GitHub Actions restriction --
    # only env/github/inputs/job/matrix/needs/runner/steps/strategy/vars are
    # allowed there). Surfacing it through job-level `env:` first, which CAN
    # read secrets, works around that: skips quietly instead of failing until
    # CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN are added under repo
    # Settings > Secrets and variables > Actions -- see docs/translations.md.
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # upload_translations: true so hand-written/PR-reviewed content already
      # committed to resources/lang/{code}.json (e.g. es-es.json, which was
      # seeded directly in the repo, not through Crowdin) is pushed into
      # Crowdin's translation memory. Without this, Crowdin has no record of
      # that content and download-translations exports every locale as 0%
      # translated -- overwriting real translations with source-language
      # placeholder text. auto_approve_imported: true because this only
      # uploads what's already on `main`, which went through the same PR
      # review/CI validation as everything else.
      - uses: crowdin/github-action@v2
        if: env.CROWDIN_PROJECT_ID != ''
        with:
          upload_sources: true
          upload_translations: true
          auto_approve_imported: true
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ env.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ env.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    name: Open a PR with translations from Crowdin
    needs: upload-sources
    # always(): without it, GitHub implicitly ANDs a bare if: with success()
    # of `needs`, which would skip this job on the weekly `schedule` trigger
    # (upload-sources doesn't run then, so it reports as skipped, not
    # successful). `needs: upload-sources` still sequences the two jobs on a
    # workflow_dispatch run so download can't race ahead of a fresh upload.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # skip_untranslated_strings: true so an untranslated key is omitted
      # (falls through the LocaleRegistry chain to its parent/en-us) instead
      # of being filled with source-language text -- which would both shadow
      # a parent dialect's real translation and make a 0%-translated locale
      # falsely read as 100% complete by key count alone. A fully-untranslated
      # locale still gets a near-empty {} file rather than no file at all --
      # Crowdin CLI rejects skip_untranslated_files combined with this option.
      - uses: crowdin/github-action@v2
        if: env.CROWDIN_PROJECT_ID != ''
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'New Crowdin translations'
          pull_request_body: |
            Translations pulled from [Crowdin](https://crowdin.com).

            CI will validate placeholder tokens and JSON structure on this PR
            (see .github/workflows/validate-translations.yml). A locale only
            becomes selectable in Domain Settings once it clears the
            completion threshold in `config('locales.minimum_completion')`.
          pull_request_base_branch_name: 'main'
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ env.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ env.CROWDIN_PERSONAL_TOKEN }}
